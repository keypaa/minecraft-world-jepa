# Stage 1: 4-frame context warmup
# 256×256, 4 frames × 256 tokens = 1,024 tokens total
# batch_size=32 keeps ~5s/step on PRO 6000, ~$0.004/step
inherits: base
context: 4
lr: 0.0003
batch_size: 32
run_name: world-model-stage1-4ctx
epochs: 2
lr_reset: true

