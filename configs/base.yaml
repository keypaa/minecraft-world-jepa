# Active: 256x256. SD-VAE 8x downsample -> grid 32, patch 2 -> 256 tok/frame.
# Measured: 338M ctx4 batch32 -> 58.81 GiB peak, 1.25s/step steady (PRO 6000, SDPA).
model:
  latent_dim: 4
  patch_size: 2
  latent_grid_size: 32
  embed_dim: 1024
  num_blocks: 16
  num_heads: 16
  max_frames: 32
  num_actions: 29
  action_embed_dim: 512
training:
  weight_decay: 0.05
  betas: [0.9, 0.95]
  grad_clip: 1.0
  precision: bf16
  log_freq: 100
  save_freq: 1000
  save_every_steps: 500  # overwrite latest.pt this often (~10 min at 1.2s/step)
  # hf_repo_id: "keypaa/minecraft-world-jepa-ckpts"  # + HF_TOKEN env: mirror latest.pt to Hub
data:
  target_size: 256
  chunk_size: 32
