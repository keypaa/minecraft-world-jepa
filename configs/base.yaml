# === CHOSEN RESOLUTION: 256×256 ==============================================
# SD-VAE downsamples 8× → latent grid 32×32, patch_size=2 → 256 tokens/frame
# Target: 300M params, visually clean Minecraft output on PRO 6000 ($3.03/h)
# Cost estimate for all 4 stages: ~$6-8 on PRO 6000
# =============================================================================
model:
  latent_dim: 4
  patch_size: 2
  latent_grid_size: 32
  embed_dim: 1024
  num_blocks: 16
  num_heads: 16
  max_frames: 32
  num_actions: 29
  action_embed_dim: 512

training:
  weight_decay: 0.05
  betas: [0.9, 0.95]
  grad_clip: 1.0
  precision: bf16
  log_freq: 100
  save_freq: 1000

data:
  target_size: 256
  chunk_size: 32
  latent_stats: /volumes/data/latent_stats.pt

vae:
  model_name: sd-vae
  ckpt_path: /volumes/vae-checkpoints/vae-finetune-v1.pt

